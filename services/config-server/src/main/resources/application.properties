spring.config.import=optional:file:../../.env[.properties]

server.port=8888
spring.application.name=config-server

spring.cloud.config.server.git.uri=https://github.com/${GITHUB_USERNAME}/creditlens-config-repo.git

spring.cloud.config.server.git.username=${GITHUB_USERNAME}
spring.cloud.config.server.git.password=${GITHUB_TOKEN}

spring.cloud.config.server.git.default-label=main

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/